name: Reconstruir GIFs do gato
on:
  push:
    paths:
      - 'assets/sexta13/source/**'
      - '.github/workflows/restore-gifs.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir GIFs originais enviados pelo Ateliê
        shell: bash
        run: |
          set -euo pipefail
          cat assets/sexta13/source/gato-parado/*.b64 | base64 --decode > assets/sexta13/gato-parado.gif
          cat assets/sexta13/source/gato-comendo/*.b64 | base64 --decode > assets/sexta13/gato-comendo.gif
          file assets/sexta13/gato-*.gif
      - name: Versionar animações
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sexta13/gato-parado.gif assets/sexta13/gato-comendo.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Restaurar GIFs do gato a partir do JSON do Ateliê'
            git push
          fi
